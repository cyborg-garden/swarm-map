name: sanitization

# swarm-map's own run of the canonical gate (sanitization-gate.yml, in this
# repo). Called locally (./), so a PR that changes the gate is tested and gated
# by its own change; other repos call it pinned to a sanitization-gate-v* tag.
#
# Scope differs by trigger:
#   * pull_request → DIFF-ONLY (git diff origin/main...HEAD, the full PR range).
#     Never flaky-blocks contributors on pre-existing, untouched content.
#   * push: main   → FULL-TREE. Publish-time backstop.
# The daily full-tree audit lives in sanitization-scheduled.yml.
#
# What swarm-map counts as a particular, and which paths carry content, lives in
# sanitize.config.json — not in the script.
on:
  pull_request:
    paths:
      - 'infra/templates/**'
      - 'docs/**'
      - '**/*.md'
      - 'SOUL*'
      - '**/SOUL*'
      - 'sanitize.config.json'
      - 'scripts/check_sanitization.py'
      - 'scripts/test_check_sanitization.py'
      - '.github/workflows/sanitization.yml'
      - '.github/workflows/sanitization-scheduled.yml'
      - '.github/workflows/sanitization-gate.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sanitize:
    uses: ./.github/workflows/sanitization-gate.yml
    with:
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'full-tree' }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

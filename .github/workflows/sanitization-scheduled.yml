name: sanitization-scheduled

# Scheduled FULL-TREE sanitization audit — the detection backstop for the
# diff-only PR gate. A leak could reach the base package in a file no single PR
# touched (a rename, a merge, an out-of-band edit); this lane re-scans the whole
# tree daily with both layers, fail-closed. workflow_dispatch runs it on demand.
on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitize-full-tree:
    uses: ./.github/workflows/sanitization-gate.yml
    with:
      mode: full-tree
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

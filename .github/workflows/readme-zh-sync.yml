name: readme-zh-sync

# Keeps README.zh-CN.md (Simplified) and README.zh-TW.md (Traditional, Taiwan)
# in step with README.md, with no human step.
#
# When README.md changes on main, scripts/sync-readme-zh.mjs, once per locale,
# feeds the model the English at that translation's marker commit, the new
# English, the diff and the current translation, and takes back the translation
# with only the changed parts updated. The reply is validated mechanically (images, links, code blocks,
# sections, length, unchanged text kept, no invented URLs or hosts) and its
# links are checked against GitHub's own render of it before it is written.
#
# HOW IT LANDS. main has a ruleset requiring the `sanitize / sanitize` check
# (from GitHub Actions) on the exact commit. GITHUB_TOKEN pushes and PRs start
# no workflows, and dispatch-started checks do not count for rulesets. So the
# bot works through a GitHub App (cyborg-garden-readme-sync, installed on this
# repo only; tokens last one hour):
#   1. sync: translate each drifted locale, validate, and run both
#      sanitization layers on the changed files in-job (so nothing unvetted
#      reaches a public branch), then make one commit on top of the main it
#      started from, force-push it to bot/readme-zh-sync with an App token, and
#      open (or reuse) one PR to main. Touches README.zh-CN.md and/or
#      README.zh-TW.md only (the job checks).
#   2. land: the App-authored push runs sanitization.yml on the PR, the real
#      gate. When `sanitize / sanitize` succeeds on that exact SHA, merge the
#      PR with --match-head-commit, so a commit the gate never saw cannot land.
#      If any README changed on main meanwhile, stop: that push re-runs
#      the sync from fresh main. Unrelated commits on main do not block it.
# No check run is ever created by hand: only the gate's own run can pass it.
#
# A failed run writes nothing to main. The weekly schedule retries, so drift
# heals without anyone re-running it.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/sync-readme-zh.mjs
      - .github/workflows/readme-zh-sync.yml
  schedule:
    - cron: '41 7 * * 1'   # Mondays 07:41 UTC: retry anything a failed run left
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-zh-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: bot/readme-zh-sync

jobs:
  sync:
    if: github.repository == 'cyborg-garden/swarm-map'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read    # pushes go through the App token, not this one
    env:
      LOCALES: zh-CN zh-TW
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      base: ${{ steps.push.outputs.base }}
      pr: ${{ steps.push.outputs.pr }}
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          # The push below must not ride on GITHUB_TOKEN (it would start no gate).
          persist-credentials: false
          # Full history: the marker names an older commit to diff against.
          fetch-depth: 0

      - name: Check for drift
        id: drift
        run: |
          set -uo pipefail
          drifted=""
          for loc in $LOCALES; do
            rc=0
            node scripts/sync-readme-zh.mjs --check --locale "$loc" || rc=$?
            case "$rc" in
              0) ;;
              3) drifted="$drifted $loc" ;;
              *) echo "::error::drift check failed for $loc (exit $rc)"; exit "$rc" ;;
            esac
          done
          drifted="${drifted# }"
          echo "locales=$drifted" >> "$GITHUB_OUTPUT"
          if [ -n "$drifted" ]; then echo "drift=true" >> "$GITHUB_OUTPUT"; else echo "drift=false" >> "$GITHUB_OUTPUT"; fi

      - name: Translate the changed parts
        if: steps.drift.outputs.drift == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Only for POST /markdown (GitHub's renderer, the link check's ground truth).
          GITHUB_TOKEN: ${{ github.token }}
          DRIFTED: ${{ steps.drift.outputs.locales }}
        run: |
          set -euo pipefail
          for loc in $DRIFTED; do
            node scripts/sync-readme-zh.mjs --write --locale "$loc"
          done

      - name: Only the translations may change
        if: steps.drift.outputs.drift == 'true'
        id: changed
        run: |
          set -euo pipefail
          changed="$(git status --porcelain)"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=""
          while IFS= read -r line; do
            case "$line" in
              " M README.zh-CN.md") files="$files README.zh-CN.md" ;;
              " M README.zh-TW.md") files="$files README.zh-TW.md" ;;
              *) echo "::error::the sync changed something other than README.zh-CN.md / README.zh-TW.md ($line); refusing to commit"; exit 1 ;;
            esac
          done <<< "$changed"
          echo "files=${files# }" >> "$GITHUB_OUTPUT"
          echo "any=true" >> "$GITHUB_OUTPUT"

      # Pre-publication check: the side branch is public, so the file is gated
      # before it is pushed anywhere. Gate script and config come from this
      # checkout, which is main, so the translation cannot weaken its judge.
      # The authoritative gate for main is the PR's own `sanitize / sanitize` run.
      - name: "Sanitization: config check"
        if: steps.changed.outputs.any == 'true'
        run: python3 scripts/check_sanitization.py --check-config

      - name: "Sanitization: secrets & PII (deterministic)"
        if: steps.changed.outputs.any == 'true'
        env:
          OPENROUTER_API_KEY: ""
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          # shellcheck disable=SC2086 # FILES is a space-separated list of fixed names
          python3 scripts/check_sanitization.py $FILES --deterministic-only --require-config

      - name: "Sanitization: particulars (semantic, fails closed)"
        if: steps.changed.outputs.any == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          # shellcheck disable=SC2086 # FILES is a space-separated list of fixed names
          python3 scripts/check_sanitization.py $FILES --require-semantic --require-config

      - name: Mint a short-lived App token
        id: app
        if: steps.changed.outputs.any == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.README_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.README_SYNC_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit, push the side branch, open the PR
        id: push
        if: steps.changed.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          git config user.name "cyborg-garden-readme-sync[bot]"
          git config user.email "cyborg-garden-readme-sync[bot]@users.noreply.github.com"
          base="$(git rev-parse HEAD)"
          # shellcheck disable=SC2086 # FILES is a list of fixed names
          set -- $FILES
          # Line 2 of every translation is the shared English marker.
          src="$(sed -n '2s/.*@ \([0-9a-f]*\)\. .*/\1/p' "$1")"
          what="$(printf '%s\n' "$@" | sed 's/^README\.\(.*\)\.md$/\1/' | paste -sd, - | sed 's/,/, /g')"
          git add -- "$@"
          git commit -q -m "docs(readme): sync ${what} translation to ${src}" \
            -m "Automated by .github/workflows/readme-zh-sync.yml: README.md changed since the translations' marker commit, so only the changed parts were retranslated and validated by scripts/sync-readme-zh.mjs. Lands on main only after sanitization.yml passes on this exact commit."
          # Push as the App (not GITHUB_TOKEN) so the PR's gate actually runs.
          # Basic auth in a one-off header: no credential in the URL or git config.
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin "HEAD:refs/heads/$SYNC_BRANCH"
          sha="$(git rev-parse HEAD)"
          pr="$(gh pr list --repo "$REPO" --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            url="$(gh pr create --repo "$REPO" --head "$SYNC_BRANCH" --base main \
              --title "docs(readme): sync ${what} translation to ${src}" \
              --body "Automated by \`.github/workflows/readme-zh-sync.yml\`. Only the Chinese translations change (${FILES}). The workflow merges this once \`sanitize / sanitize\` passes on this exact commit.")"
            pr="${url##*/}"
          fi
          { echo "base=$base"; echo "sha=$sha"; echo "pr=$pr"; } >> "$GITHUB_OUTPUT"

  land:
    needs: sync
    if: needs.sync.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: read
    env:
      REPO: ${{ github.repository }}
      SHA: ${{ needs.sync.outputs.sha }}
      BASE: ${{ needs.sync.outputs.base }}
      PR: ${{ needs.sync.outputs.pr }}
    steps:
      - name: Wait for the sanitization gate on the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The ruleset wants `sanitize / sanitize` from GitHub Actions (app
          # 15368) on this SHA, from the PR run the App's push started.
          q="repos/$REPO/commits/$SHA/check-runs?check_name=sanitize%20%2F%20sanitize&filter=latest"
          for _ in $(seq 1 80); do
            state="$(gh api "$q" --jq '[.check_runs[] | select(.app.id == 15368)] | if length == 0 then "none" elif any(.status != "completed") then "running" elif all(.conclusion == "success") then "success" else "failed" end')"
            case "$state" in
              success) echo "gate=passed" >> "$GITHUB_ENV"; exit 0 ;;
              failed) echo "::error::sanitization failed on $SHA; not landing. See PR #$PR"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::no finished 'sanitize / sanitize' check on $SHA after 40 minutes"
          exit 1

      - name: Mint a short-lived App token
        id: app
        if: env.gate == 'passed'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.README_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.README_SYNC_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge the PR
        if: env.gate == 'passed'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -uo pipefail
          case "$PR" in ''|*[!0-9]*) echo "::error::bad PR number from the sync job: '$PR'"; exit 1 ;; esac
          # Other commits on main are fine (the PR touches the translations only).
          # Refuse only if any README changed since the translation started:
          # then the gated text is stale. A README.md push re-runs the sync; a
          # hand edit to a translation alone waits for the weekly run.
          for f in README.md README.zh-CN.md README.zh-TW.md; do
            old="$(gh api "repos/$REPO/contents/$f?ref=$BASE" --jq .sha)" || exit 1
            new="$(gh api "repos/$REPO/contents/$f?ref=main" --jq .sha)" || exit 1
            if [ -z "$old" ] || [ -z "$new" ]; then echo "::error::could not read $f"; exit 1; fi
            if [ "$old" != "$new" ]; then
              echo "::notice::$f changed on main while the gate ran; not landing. The next trigger redoes the sync from fresh main."
              exit 0
            fi
          done
          # --match-head-commit: refuse if the branch moved off the gated SHA.
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch --match-head-commit "$SHA"
